name: ComfyUIDemo
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: ComfyUIDemo/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ComfyUIDemo:
    type: application
    platform: iOS
    sources:
      - path: ComfyUIDemo
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.comfyui
        PRODUCT_NAME: ComfyUIDemo
