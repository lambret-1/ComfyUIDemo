name: 构建未签名 IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: 构建 iOS 未签名 IPA
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 降级项目格式兼容 Xcode 15.4
        run: |
          # XcodeGen 新版默认生成 objectVersion=77（Xcode 16格式），降级为 56（Xcode 14+ 兼容）
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' ComfyUIDemo.xcodeproj/project.pbxproj
          grep "objectVersion" ComfyUIDemo.xcodeproj/project.pbxproj

      - name: 构建归档
        run: |
          xcodebuild archive \
            -scheme ComfyUIDemo \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/ComfyUIDemo.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 手动打包未签名 IPA
        run: |
          # 未签名归档无法使用 exportArchive，手动从 xcarchive 提取 .app 并打包为 IPA
          mkdir -p ./output/Payload
          cp -R ./build/ComfyUIDemo.xcarchive/Products/Applications/ComfyUIDemo.app ./output/Payload/
          cd ./output
          zip -qr ComfyUIDemo.ipa Payload
          cd ..
          ls -lh ./output/ComfyUIDemo.ipa

      - name: 验证 IPA 产物
        run: |
          ls -lh ./output/*.ipa
          echo "IPA 大小: $(du -h ./output/*.ipa | cut -f1)"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUIDemo-unsigned
          path: ./output/*.ipa
          retention-days: 30

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ComfyUIDemo/Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "当前版本: $VERSION"

      - name: 创建 Git 标签
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v$VERSION"
          git push origin "v$VERSION" --force

      - name: 创建 GitHub Release 并上传 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ComfyUIDemo v${{ steps.version.outputs.version }}
          body: |
            ## ComfyUIDemo v${{ steps.version.outputs.version }}

            未签名 IPA，适用于 TrollStore 侧载安装。

            ### 安装方式
            1. 下载下方 `ComfyUIDemo.ipa`
            2. 在 TrollStore 中选择「Install IPA」
            3. 选择下载的 IPA 文件完成安装
          files: ./output/ComfyUIDemo.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
